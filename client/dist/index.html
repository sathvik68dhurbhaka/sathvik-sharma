<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F97316'><path d='M12 2L1 7l11 5 9-4.09V17h2V7L12 2zM3.45 10.55L12 14.45l8.55-3.9V14c0 3.31-2.69 6-6 6h-5.1c-3.31 0-6-2.69-6-6v-3.45z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Study Manager - Intelligent Academic Productivity</title>
    <meta name="description" content="AI Study Manager is an intelligent academic productivity platform that helps students organize timetables, track assignments, and master subjects with a personalized AI tutor." />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS with strict orange & clean white theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                orange: '#F97316',
                hover: '#EA580C',
                light: '#FFEDD5',
                subtle: '#FFF7ED',
              },
              surface: {
                DEFAULT: '#FFFFFF',
                muted: '#F9FAFB',
                card: '#FFFFFF',
                border: '#E5E7EB',
                hover: '#F3F4F6',
              },
              content: {
                primary: '#111827',
                secondary: '#4B5563',
                muted: '#9CA3AF',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #FFFFFF;
        color: #111827;
      }
      /* Custom clean scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F9FAFB;
      }
      ::-webkit-scrollbar-thumb {
        background: #D1D5DB;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #F97316;
      }
    </style>
  </head>
  <body class="bg-white text-content-primary antialiased font-sans min-h-screen selection:bg-orange-100 selection:text-orange-900">
    <div id="root"></div>
    <script type="module" src="/bundle.js"></script>
  </body>
</html>
